<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Generative Art Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    canvas {
      flex: 1;
      display: block;
      cursor: crosshair;
    }

    #controls {
      background: rgba(10, 10, 20, 0.92);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      backdrop-filter: blur(8px);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    label { opacity: 0.7; white-space: nowrap; }

    input[type=range] {
      width: 90px;
      accent-color: #7c6ff7;
    }

    select {
      background: #1a1a2e;
      color: #eee;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 13px;
      cursor: pointer;
    }

    button {
      background: rgba(124,111,247,0.2);
      color: #c0b8ff;
      border: 1px solid rgba(124,111,247,0.4);
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: rgba(124,111,247,0.4); }

    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0.25;
      pointer-events: none;
      transition: opacity 1s;
    }
    #hint h2 { font-size: 2rem; font-weight: 300; letter-spacing: 4px; }
    #hint p  { margin-top: 8px; font-size: 0.9rem; letter-spacing: 1px; }
    #hint.hidden { opacity: 0; }

    #val-count, #val-trail, #val-size { min-width: 22px; opacity: 0.9; }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hint">
  <h2>MOVE YOUR MOUSE</h2>
  <p>or touch the canvas</p>
</div>

<div id="controls">
  <div class="ctrl-group">
    <label>パレット</label>
    <select id="sel-palette">
      <option value="cosmic">Cosmic</option>
      <option value="fire">Fire</option>
      <option value="ocean">Ocean</option>
      <option value="forest">Forest</option>
      <option value="candy">Candy</option>
      <option value="mono">Mono</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>粒子数</label>
    <input type="range" id="sl-count" min="20" max="300" value="100">
    <span id="val-count">100</span>
  </div>

  <div class="ctrl-group">
    <label>軌跡</label>
    <input type="range" id="sl-trail" min="1" max="60" value="20">
    <span id="val-trail">20</span>
  </div>

  <div class="ctrl-group">
    <label>サイズ</label>
    <input type="range" id="sl-size" min="1" max="12" value="3">
    <span id="val-size">3</span>
  </div>

  <div class="ctrl-group">
    <label>モード</label>
    <select id="sel-mode">
      <option value="follow">追尾</option>
      <option value="orbit">回転</option>
      <option value="explode">爆発</option>
      <option value="wave">波</option>
    </select>
  </div>

  <button id="btn-clear">クリア</button>
  <button id="btn-save">保存 ↓</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

// --- Palettes ---
const PALETTES = {
  cosmic: ['#ff6ec7','#c77dff','#7b9cff','#00d4ff','#ffffff'],
  fire:   ['#ff0000','#ff4500','#ff8c00','#ffd700','#fff8dc'],
  ocean:  ['#00f5d4','#00bbf9','#0077b6','#48cae4','#90e0ef'],
  forest: ['#55a630','#80b918','#aacc00','#bfd200','#d4e157'],
  candy:  ['#ff006e','#fb5607','#ffbe0b','#8338ec','#3a86ff'],
  mono:   ['#ffffff','#cccccc','#999999','#666666','#333333'],
};

// --- State ---
let mx = -1000, my = -1000;
let touched = false;
let particles = [];
let maxParticles = 100;
let trailLength = 20;
let particleSize = 3;
let palette = PALETTES.cosmic;
let mode = 'follow';
let t = 0;

// --- Resize ---
function resize() {
  canvas.width  = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Particle ---
class Particle {
  constructor() { this.reset(); }

  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.color = palette[Math.floor(Math.random() * palette.length)];
    this.trail = [];
    this.angle = Math.random() * Math.PI * 2;
    this.radius = 40 + Math.random() * 80;
    this.speed  = 0.02 + Math.random() * 0.04;
    this.phase  = Math.random() * Math.PI * 2;
  }

  update() {
    const dx = mx - this.x;
    const dy = my - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;

    if (mode === 'follow') {
      const force = Math.min(3, 120 / dist);
      this.vx += (dx / dist) * force * 0.08;
      this.vy += (dy / dist) * force * 0.08;
      this.vx *= 0.92;
      this.vy *= 0.92;
      this.x += this.vx;
      this.y += this.vy;

    } else if (mode === 'orbit') {
      this.angle += this.speed;
      this.x += (mx + Math.cos(this.angle) * this.radius - this.x) * 0.05;
      this.y += (my + Math.sin(this.angle) * this.radius - this.y) * 0.05;

    } else if (mode === 'explode') {
      const force = Math.max(0, 200 - dist) / 200;
      this.vx -= (dx / dist) * force * 0.4;
      this.vy -= (dy / dist) * force * 0.4;
      this.vx *= 0.96;
      this.vy *= 0.96;
      this.x += this.vx;
      this.y += this.vy;

    } else if (mode === 'wave') {
      const wt = t * 0.02 + this.phase;
      const tx = mx + Math.cos(wt) * this.radius;
      const ty = my + Math.sin(wt * 1.3) * this.radius * 0.5;
      this.x += (tx - this.x) * 0.04;
      this.y += (ty - this.y) * 0.04;
    }

    // Wrap
    if (this.x < 0) this.x = canvas.width;
    if (this.x > canvas.width) this.x = 0;
    if (this.y < 0) this.y = canvas.height;
    if (this.y > canvas.height) this.y = 0;

    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > trailLength) this.trail.shift();
  }

  draw() {
    if (this.trail.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(this.trail[0].x, this.trail[0].y);
    for (let i = 1; i < this.trail.length; i++) {
      ctx.lineTo(this.trail[i].x, this.trail[i].y);
    }
    const alpha = 0.8;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = particleSize * (this.trail.length / trailLength);
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Head glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, particleSize * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(n) {
  while (particles.length < n) particles.push(new Particle());
  while (particles.length > n) particles.pop();
}
spawnParticles(maxParticles);

// --- Draw loop ---
function draw() {
  t++;
  // Fade background
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 1;

  for (const p of particles) { p.update(); p.draw(); }

  requestAnimationFrame(draw);
}
draw();

// --- Mouse / Touch ---
function onMove(x, y) {
  mx = x; my = y;
  if (!touched) {
    touched = true;
    hint.classList.add('hidden');
  }
}

canvas.addEventListener('mousemove', e => onMove(e.clientX, e.clientY - 0));
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  onMove(t.clientX, t.clientY);
}, { passive: false });

// --- Controls ---
const slCount = document.getElementById('sl-count');
const slTrail = document.getElementById('sl-trail');
const slSize  = document.getElementById('sl-size');
const valCount = document.getElementById('val-count');
const valTrail = document.getElementById('val-trail');
const valSize  = document.getElementById('val-size');

slCount.addEventListener('input', () => {
  maxParticles = +slCount.value;
  valCount.textContent = maxParticles;
  spawnParticles(maxParticles);
});

slTrail.addEventListener('input', () => {
  trailLength = +slTrail.value;
  valTrail.textContent = trailLength;
});

slSize.addEventListener('input', () => {
  particleSize = +slSize.value;
  valSize.textContent = particleSize;
});

document.getElementById('sel-palette').addEventListener('change', e => {
  palette = PALETTES[e.target.value];
  for (const p of particles) p.color = palette[Math.floor(Math.random() * palette.length)];
});

document.getElementById('sel-mode').addEventListener('change', e => {
  mode = e.target.value;
  for (const p of particles) p.reset();
});

document.getElementById('btn-clear').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const p of particles) p.reset();
});

document.getElementById('btn-save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `generative-art-${Date.now()}.png`;
  a.href = canvas.toDataURL();
  a.click();
});
</script>
</body>
</html>
